aid: outschool
name: Outschool
description: 'Outschool is an education-technology marketplace for live, small-group
  online classes for learners ages 3-18. It connects families and independent teachers
  across 140,000+ subjects — from math and coding to art, music, and hobbies — offered
  as one-time sessions, ongoing courses, camps, and social clubs delivered over live
  video. Outschool also serves schools and districts through its for-organizations
  program. Backed by Bond Capital, Lightspeed Venture Partners, Union Square Ventures,
  and Y Combinator, the platform is a consumer web application; it exposes no publicly
  documented developer API. The site is powered by an internal, undocumented GraphQL
  endpoint (outschool.com/graphql) used only by its own front end and largely blocked
  to crawlers. This profile is an API Evangelist network company record enriched from
  the provider''s public web surface.'
